<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Translator" />
<meta name="theme-color" content="#2563eb" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<title>English Translator</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --card-2: #f1f5f9;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #2563eb;
    --accent-2: #10b981;
    --border: #e2e8f0;
    --warn: #d97706;
    --onaccent: #ffffff;
    --shadow: 0 1px 2px rgba(15,23,42,0.06), 0 1px 3px rgba(15,23,42,0.04);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { width: 100%; max-width: 640px; margin: 0 auto; padding: 14px 14px 40px; }

  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 1.15rem; margin: 0; flex: 1; }
  .iconbtn {
    background: var(--card); color: var(--muted); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 11px; font-size: 0.95rem; cursor: pointer;
  }
  .iconbtn.on { color: var(--onaccent); background: var(--accent); border-color: var(--accent); }

  .modes { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 2px; }
  .modes button {
    flex: 0 0 auto; background: var(--card); color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 13px; font-size: 0.85rem; cursor: pointer; white-space: nowrap;
  }
  .modes button.on { background: var(--accent); color: var(--onaccent); border-color: var(--accent); font-weight: 600; }

  .inputbox { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; box-shadow: var(--shadow); }
  textarea {
    width: 100%; background: transparent; color: var(--text); border: none;
    resize: none; font-size: 1.05rem; line-height: 1.5; outline: none;
    font-family: inherit; min-height: 76px;
  }
  textarea::placeholder { color: #94a3b8; }
  .inputbar { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .mic {
    background: var(--card-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 12px; font-size: 0.85rem; cursor: pointer;
  }
  .mic.rec { background: #dc2626; border-color: #dc2626; color: #fff; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.55; } }
  .go {
    margin-left: auto; background: var(--accent); color: var(--onaccent); border: none;
    border-radius: 10px; padding: 11px 22px; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .go:disabled { opacity: 0.5; }

  .status { color: var(--muted); font-size: 0.88rem; margin: 14px 2px; }
  .status.err { color: #b91c1c; line-height: 1.6; }
  .understood { color: var(--muted); font-size: 0.85rem; margin: 14px 2px 6px; }
  .main {
    background: var(--card-2); border: 1px solid var(--border); border-left: 3px solid var(--accent-2);
    border-radius: 10px; padding: 11px 13px; margin-bottom: 12px;
    font-size: 0.98rem; line-height: 1.55; white-space: pre-wrap;
  }
  .item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 13px; margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .label {
    display: inline-block; font-size: 0.72rem; color: #fff; background: var(--muted);
    border-radius: 999px; padding: 2px 9px; margin-bottom: 8px; font-weight: 700;
  }
  .item .en {
    font-size: 1.18rem; line-height: 1.45; font-weight: 600; margin-bottom: 6px;
    word-break: break-word; cursor: pointer;
  }
  .item .ko { color: var(--text); font-size: 0.92rem; margin-bottom: 5px; }
  .item .note { color: var(--muted); font-size: 0.83rem; line-height: 1.5; }
  .acts { display: flex; gap: 6px; margin-top: 10px; }
  .acts button {
    flex: 1; background: var(--card-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 9px; padding: 9px 4px; font-size: 0.82rem; cursor: pointer;
  }
  .acts button:active { background: var(--border); }
  .acts button.saved { color: var(--warn); border-color: var(--warn); }
  .tip {
    background: #fffbeb; border: 1px solid #fcd34d;
    border-radius: 10px; padding: 11px 13px; font-size: 0.87rem; line-height: 1.55; color: #92400e;
  }

  #show {
    position: fixed; inset: 0; background: #fff; color: #000; z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 28px; text-align: center;
  }
  #show.on { display: flex; }
  #show p { font-size: 2rem; line-height: 1.35; font-weight: 600; margin: 0; word-break: break-word; }

  .panel { display: none; }
  .panel.on { display: block; }
  .saveitem {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 13px; margin-bottom: 8px; box-shadow: var(--shadow);
  }
  .saveitem .en { font-size: 1.02rem; font-weight: 600; margin-bottom: 3px; }
  .saveitem .ko { color: var(--muted); font-size: 0.85rem; }
  .saveitem .row2 { display: flex; gap: 6px; margin-top: 9px; }
  .saveitem .row2 button {
    background: var(--card-2); color: var(--muted); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; font-size: 0.8rem; cursor: pointer;
  }
  .keyrow { display: flex; gap: 8px; margin: 10px 0; }
  .keyrow input {
    flex: 1; background: var(--card-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px; font-size: 0.9rem; font-family: monospace;
  }
  .help { color: var(--muted); font-size: 0.85rem; line-height: 1.65; }
  select {
    width: 100%; margin-top: 6px; background: var(--card-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 0.9rem;
  }
  hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1 id="title">English Translator</h1>
    <button class="iconbtn" id="tabSaved" title="저장함">⭐</button>
    <button class="iconbtn" id="tabSet" title="설정">⚙️</button>
  </header>

  <div class="panel on" id="pMain">
    <div class="modes" id="modes">
      <button data-mode="ko2en" class="on">한국어 → 영어</button>
      <button data-mode="en2ko">영어 → 뜻</button>
      <button data-mode="word">단어</button>
      <button data-mode="fix">내 영어 첨삭</button>
    </div>

    <div class="inputbox">
      <textarea id="q" placeholder="하고 싶은 말을 한국어로 쓰세요"></textarea>
      <div class="inputbar">
        <button class="mic" id="micKo">🎤 한국어</button>
        <button class="mic" id="micEn">🎤 English</button>
        <button class="go" id="go">찾기</button>
      </div>
    </div>

    <div class="status" id="status"></div>
    <div id="out"></div>
  </div>

  <div class="panel" id="pSaved">
    <div class="status" id="savedCount"></div>
    <div id="savedList"></div>
  </div>

  <div class="panel" id="pSet">
    <p class="help">Claude API 키를 넣으면 됩니다. 이 브라우저 안에만 저장되고 밖으로 나가지 않습니다.</p>
    <div class="keyrow">
      <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off" />
      <button class="iconbtn" id="keySave">저장</button>
    </div>
    <p class="help" id="keyState"></p>
    <p class="help">
      <button class="iconbtn" id="keyShow">👁 저장된 키 보기</button>
      <button class="iconbtn" id="keyCopy">📋 복사</button>
    </p>

    <hr />
    <p class="help"><b>속도</b></p>
    <select id="speed">
      <option value="haiku">⚡ 빠르게 — 가장 빠름 (Haiku)</option>
      <option value="opusfast">🚀 빠르고 좋게 — 요금 2배 (Opus 빠른모드)</option>
      <option value="opus">🎯 좋게 — 가장 자연스러움 (Opus)</option>
    </select>

    <hr />
    <p class="help"><b>목소리</b></p>
    <select id="voice"></select>

    <hr />
    <p class="help">
      <b>쓰는 법</b><br />
      · <b>🔊</b> 를 누르면 폰이 영어로 읽어 줍니다 — 상대방에게 들려주세요.<br />
      · 영어 문장을 <b>누르면</b> 화면 가득 크게 나옵니다 — 시끄러운 곳에서 보여주세요.<br />
      · <b>☆</b> 는 저장함에 담깁니다.<br />
      · <b>🎤</b> 는 말로 입력합니다. (안드로이드 크롬 / 아이폰 사파리)
    </p>

    <hr />
    <p class="help">
      <button class="iconbtn" id="wipe" style="color:#b91c1c;border-color:#fecaca">저장함 전체 비우기</button>
    </p>
  </div>

</div>

<div id="show"><p id="showText"></p></div>

<script type="module">
import Anthropic from "https://esm.sh/@anthropic-ai/sdk@0.123.0";

const $ = (id) => document.getElementById(id);
const LS_KEY = "eh_apikey";
const LS_SAVED = "eh_saved";
const LS_VOICE = "eh_voice";
const LS_SPEED = "eh_speed";

let mode = "ko2en";
let busy = false;

const PLACEHOLDER = {
  ko2en: "하고 싶은 말을 한국어로 쓰세요",
  en2ko: "들은 영어 문장을 그대로 쓰세요",
  word: "궁금한 단어나 표현을 쓰세요",
  fix: "내가 쓴 영어 문장을 쓰세요",
};

$("modes").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  mode = b.dataset.mode;
  [...$("modes").children].forEach((x) => x.classList.toggle("on", x === b));
  $("q").placeholder = PLACEHOLDER[mode];
});

function tab(name) {
  $("pMain").classList.toggle("on", name === "main");
  $("pSaved").classList.toggle("on", name === "saved");
  $("pSet").classList.toggle("on", name === "set");
  $("tabSaved").classList.toggle("on", name === "saved");
  $("tabSet").classList.toggle("on", name === "set");
  $("title").textContent = name === "saved" ? "저장함" : name === "set" ? "설정" : "English Translator";
  if (name === "saved") renderSaved();
}
$("tabSaved").onclick = () => tab($("pSaved").classList.contains("on") ? "main" : "saved");
$("tabSet").onclick = () => tab($("pSet").classList.contains("on") ? "main" : "set");

function getKey() { return localStorage.getItem(LS_KEY) || ""; }
function showKeyState() {
  const k = getKey();
  $("keyState").textContent = k ? "저장됨 (" + k.slice(0, 12) + "…)" : "아직 키가 없습니다.";
}
$("keySave").onclick = () => {
  const v = $("key").value.trim();
  if (v) localStorage.setItem(LS_KEY, v); else localStorage.removeItem(LS_KEY);
  $("key").value = "";
  showKeyState();
  alert(v ? "저장했습니다." : "키를 지웠습니다.");
};
$("keyShow").onclick = () => {
  const k = getKey();
  if (!k) { $("keyState").textContent = "저장된 키가 없습니다."; return; }
  $("keyState").textContent = k;
  $("keyState").style.wordBreak = "break-all";
  $("keyState").style.fontFamily = "monospace";
  $("keyState").style.userSelect = "text";
};
$("keyCopy").onclick = async (e) => {
  const k = getKey();
  if (!k) return;
  try {
    await navigator.clipboard.writeText(k);
    e.target.textContent = "복사됨";
    setTimeout(() => { e.target.textContent = "📋 복사"; }, 1500);
  } catch (err) {
    $("keyState").textContent = "복사가 막혔습니다. 위 키를 손으로 긁어서 복사하세요.";
  }
};
showKeyState();

let voices = [];
function loadVoices() {
  voices = speechSynthesis.getVoices().filter((v) => v.lang.startsWith("en"));
  const sel = $("voice");
  sel.innerHTML = "";
  voices.forEach((v) => {
    const o = document.createElement("option");
    o.value = v.name;
    o.textContent = v.name + " (" + v.lang + ")";
    sel.appendChild(o);
  });
  const saved = localStorage.getItem(LS_VOICE);
  if (saved && voices.some((v) => v.name === saved)) sel.value = saved;
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();
$("voice").onchange = (e) => localStorage.setItem(LS_VOICE, e.target.value);

const savedSpeed = localStorage.getItem(LS_SPEED);
if (savedSpeed) $("speed").value = savedSpeed;
$("speed").onchange = (e) => localStorage.setItem(LS_SPEED, e.target.value);

function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const want = localStorage.getItem(LS_VOICE);
  const v = voices.find((x) => x.name === want) || voices[0];
  if (v) u.voice = v;
  u.lang = v ? v.lang : "en-US";
  u.rate = 0.95;
  speechSynthesis.speak(u);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function listen(lang, btn) {
  if (rec) { rec.stop(); return; }
  rec = new SR();
  rec.lang = lang;
  rec.interimResults = true;
  rec.continuous = false;
  const before = $("q").value.trim();
  btn.classList.add("rec");
  rec.onresult = (e) => {
    let t = "";
    for (const r of e.results) t += r[0].transcript;
    $("q").value = (before ? before + " " : "") + t;
  };
  rec.onerror = (e) => { $("status").className = "status err"; $("status").textContent = "마이크 오류: " + e.error; };
  rec.onend = () => { btn.classList.remove("rec"); rec = null; };
  rec.start();
}
if (!SR) {
  $("micKo").style.display = "none";
  $("micEn").style.display = "none";
} else {
  $("micKo").onclick = () => listen("ko-KR", $("micKo"));
  $("micEn").onclick = () => listen("en-US", $("micEn"));
}

function getSaved() { try { return JSON.parse(localStorage.getItem(LS_SAVED)) || []; } catch (e) { return []; } }
function setSaved(a) { localStorage.setItem(LS_SAVED, JSON.stringify(a)); }
function isSaved(en) { return getSaved().some((x) => x.en === en); }
function toggleSave(item) {
  const a = getSaved();
  const i = a.findIndex((x) => x.en === item.en);
  if (i >= 0) a.splice(i, 1); else a.unshift({ en: item.en, ko: item.ko, note: item.note });
  setSaved(a);
  return i < 0;
}
function mkBtn(label, fn) {
  const b = document.createElement("button");
  b.textContent = label;
  b.onclick = fn;
  return b;
}
function renderSaved() {
  const a = getSaved();
  $("savedCount").textContent = a.length ? a.length + "개 저장됨" : "아직 저장한 표현이 없습니다.";
  $("savedList").innerHTML = "";
  a.forEach((it, idx) => {
    const d = document.createElement("div");
    d.className = "saveitem";
    d.innerHTML = '<div class="en"></div><div class="ko"></div><div class="row2"></div>';
    d.querySelector(".en").textContent = it.en;
    d.querySelector(".ko").textContent = it.ko || "";
    const row = d.querySelector(".row2");
    row.appendChild(mkBtn("🔊 듣기", () => speak(it.en)));
    row.appendChild(mkBtn("🔍 크게", () => bigShow(it.en)));
    row.appendChild(mkBtn("🗑 삭제", () => { const b = getSaved(); b.splice(idx, 1); setSaved(b); renderSaved(); }));
    $("savedList").appendChild(d);
  });
}
$("wipe").onclick = () => { if (confirm("저장함을 전부 비울까요?")) { setSaved([]); renderSaved(); } };

function bigShow(text) { $("showText").textContent = text; $("show").classList.add("on"); }
$("show").onclick = () => $("show").classList.remove("on");

const SYSTEM = `너는 한국인 직장인의 영어 도우미다. 업무 영어와 해외에서의 일상 대화를 다룬다.
이 사람은 지금 외국인 앞에서 급하게 화면을 보고 있다. 짧고 빠르게 답한다.

출력은 아래 형식의 줄만 쓴다. 다른 말은 한 글자도 쓰지 않는다.

A|꼬리표|English sentence|한국어 뜻|한 줄 설명
A|꼬리표|English sentence|한국어 뜻|한 줄 설명
A|꼬리표|English sentence|한국어 뜻|한 줄 설명
T|팁 한 문장

- A 줄은 정확히 3개.
- M 줄이 필요한 모드에서는 A 줄보다 먼저 M|설명 을 한 줄 쓴다.
- T 줄은 도움이 될 때만. 없으면 아예 안 쓴다.
- 각 칸 안에 | 문자를 쓰지 않는다.

가장 중요한 규칙 — 3개를 "격식 / 보통 / 캐주얼" 같은 공손함 등급으로 나누지 마라.
공손함 등급으로 주면 실제로는 하나만 쓸 수 있어서 쓸모가 없다.
그 대신 그 상황에서 원어민이 실제로 쓰는, 서로 정말 다른 말 3개를 준다.
셋 다 지금 바로 입 밖에 내도 되는 말이어야 한다. 어색하거나 교과서 같은 문장은 넣지 않는다.
표현을 다르게 만드는 방법: 아예 다른 동사·숙어를 쓰기, 길게 말하기와 짧게 자르기,
돌려 말하기와 직접 말하기, 미국식과 영국식, 되묻기와 단정하기.
첫 줄은 가장 무난해서 아무 상황에나 쓸 수 있는 것으로 한다.

꼬리표는 그 표현이 어떤 것인지 한마디로 (예: 가장 흔함, 짧게, 부드럽게, 직설적, 미국식, 회사에서).
"보통", "격식", "캐주얼" 은 꼬리표로 쓰지 않는다.

모드별
- ko2en: M 줄 없음. 한국어를 자연스러운 영어로. 직역하지 말고 원어민이 실제로 쓰는 말로.
- en2ko: M 줄에 그 영어의 뜻을 쉬운 한국어로. A 줄 3개는 이어서 내가 할 수 있는 영어 대답인데
  서로 다른 반응으로 준다 (예: 맞장구, 되묻기, 시간 벌기). 꼬리표는 어떤 반응인지 쓴다.
- word: M 줄에 뜻과 쓰임, 헷갈리는 비슷한 말과의 차이. A 줄 3개는 서로 다른 상황의 예문.
  꼬리표는 그 상황 (예: 회사 메일, 공항에서, 친구끼리).
- fix: M 줄에 뭐가 틀렸는지. 이 사람은 관사 누락, 전치사, 단수/복수, 주어-동사 일치를 자주 틀린다.
  A 줄 3개의 꼬리표는 "최소 수정"(원문 구조 유지), "자연스럽게", "원어민이라면".

- 한 줄 설명과 M 줄은 쉬운 한국어로 짧게. 문법 용어를 쓰면 괄호로 풀어 준다.`;

/* "A|꼬리표|영어|뜻|설명" 한 줄을 화면에 붙인다 */
function renderLine(line) {
  const p = line.split("|");
  const kind = p[0].trim();

  if (kind === "A" && p.length >= 3) {
    return itemCard({
      label: (p[1] || "").trim(),
      en: (p[2] || "").trim(),
      ko: (p[3] || "").trim(),
      note: p.slice(4).join(" ").trim(),
    });
  }
  if (kind === "M") {
    const m = document.createElement("div");
    m.className = "main";
    m.textContent = p.slice(1).join("|").trim();
    return m;
  }
  if (kind === "T") {
    const t = document.createElement("div");
    t.className = "tip";
    t.textContent = "💡 " + p.slice(1).join("|").trim();
    return t;
  }
  return null; // 형식에 안 맞는 줄은 버린다
}

function buildParams(text) {
  const p = {
    max_tokens: 950,
    system: SYSTEM,
    messages: [{ role: "user", content: "모드: " + mode + "\n입력: " + text }],
  };
  const pick = $("speed").value;
  if (pick === "haiku") {
    p.model = "claude-haiku-4-5";
  } else {
    p.model = "claude-opus-5";
    p.output_config = { effort: "low" };
    if (pick === "opusfast") {
      p.speed = "fast";
      p.betas = ["fast-mode-2026-02-01"];
    }
  }
  return p;
}

async function ask() {
  if (busy) return;
  const text = $("q").value.trim();
  if (!text) return;
  const key = getKey();
  if (!key) { tab("set"); $("keyState").textContent = "먼저 API 키를 넣어 주세요."; return; }

  busy = true;
  $("go").disabled = true;
  $("out").innerHTML = "";
  $("status").className = "status";
  $("status").textContent = "찾는 중…";
  const t0 = performance.now();

  let buf = "";       // 아직 줄바꿈을 못 만난 꼬리
  let cards = 0;      // 화면에 붙인 답 개수
  let openedAt = 0;   // 첫 글자가 도착한 시각
  let firstAt = 0;    // 첫 답이 화면에 뜬 시각
  const sec = (a, b) => ((b - a) / 1000).toFixed(1);

  const pushLine = (line) => {
    const el = renderLine(line.trim());
    if (!el) return;
    $("out").appendChild(el);
    if (el.classList.contains("item")) {
      cards++;
      if (!firstAt) {
        firstAt = performance.now();
        $("status").textContent = "연결 " + sec(t0, openedAt) + "초 · 첫 답 " + sec(t0, firstAt) + "초…";
      }
    }
  };

  try {
    const params = buildParams(text);
    const client = new Anthropic({ apiKey: key, dangerouslyAllowBrowser: true, maxRetries: 1 });
    const target = params.betas ? client.beta.messages : client.messages;

    const stream = target.stream(params).on("text", (t) => {
      if (!openedAt) openedAt = performance.now();
      buf += t;
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        pushLine(buf.slice(0, nl));
        buf = buf.slice(nl + 1);
      }
    });
    await stream.finalMessage();
    if (buf.trim()) pushLine(buf);

    if (!cards) throw new Error("답이 비어서 왔습니다. 다시 눌러 보세요.");
    $("status").textContent =
      "연결 " + sec(t0, openedAt) + "초 · 첫 답 " + sec(t0, firstAt) + "초 · 전체 " + sec(t0, performance.now()) + "초";
  } catch (err) {
    $("status").className = "status err";
    $("status").textContent = "안 됐습니다: " + (err && err.message ? err.message : String(err));
  } finally {
    busy = false;
    $("go").disabled = false;
  }
}

function itemCard(it) {
  const card = document.createElement("div");
  card.className = "item";
  card.innerHTML = '<span class="label"></span><div class="en"></div><div class="ko"></div><div class="note"></div><div class="acts"></div>';
  card.querySelector(".label").textContent = it.label || "";
  const enEl = card.querySelector(".en");
  enEl.textContent = it.en;
  enEl.onclick = () => bigShow(it.en);
  card.querySelector(".ko").textContent = it.ko || "";
  card.querySelector(".note").textContent = it.note || "";

  const acts = card.querySelector(".acts");
  acts.appendChild(mkBtn("🔊 듣기", () => speak(it.en)));
  acts.appendChild(mkBtn("📋 복사", async (e) => {
    try {
      await navigator.clipboard.writeText(it.en);
      e.target.textContent = "복사됨";
      setTimeout(() => { e.target.textContent = "📋 복사"; }, 1200);
    } catch (err) { /* 클립보드 막힌 환경 */ }
  }));
  const sv = mkBtn(isSaved(it.en) ? "⭐ 저장됨" : "☆ 저장", (e) => {
    const now = toggleSave(it);
    e.target.textContent = now ? "⭐ 저장됨" : "☆ 저장";
    e.target.classList.toggle("saved", now);
  });
  if (isSaved(it.en)) sv.classList.add("saved");
  acts.appendChild(sv);
  return card;
}

$("go").onclick = ask;
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask();
});

/* 홈 화면에 추가했을 때 앱처럼 뜨게 하는 부분.
   https 로 열었을 때만 동작하고, 파일로 열면 그냥 넘어간다. */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
